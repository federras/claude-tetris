<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a modo claro">☀ Claro</button>

  <h1 class="title" aria-label="TETRIS">
    <span>T</span><span>E</span><span>T</span><span>R</span><span>I</span><span>S</span>
  </h1>

  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="go-records" class="records hidden">
          <p id="go-msg" class="rec-msg"></p>
          <form id="go-name-form" class="name-form hidden" onsubmit="return false">
            <input id="go-name" type="text" maxlength="12" placeholder="Anónimo" autocomplete="off" aria-label="Tu nombre" />
            <button id="go-save-btn" type="button">Guardar</button>
          </form>
          <span class="label">TOP 5</span>
          <ol id="go-top" class="top-list"></ol>
          <p id="go-stats" class="rec-stats"></p>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <button id="play-btn" type="button">Jugar</button>
        <div class="records">
          <span class="label">TOP 5</span>
          <ol id="start-top" class="top-list"></ol>
          <p id="start-stats" class="rec-stats"></p>
        </div>
        <button id="reset-records-btn" type="button">Resetear records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="records.js"></script>
</body>
</html>
